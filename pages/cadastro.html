<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Contato</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">HOME</a>
            <a href="projetos.html">PROJETOS</a>
            <a href="cadastro.html">CADASTRO</a>
        </nav>
        <h1>Instituto Novo Caminho</h1>
    </header>
    <main>
        <img src="../images/helpdrawing.jpg" alt="Imagem de crianças sorrindo">
        <h2>Cadastro</h2>
        <form>
            <fieldset>
                <legend>Informações Pessoais</legend>
                
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
                
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" 
                    pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}">
                
                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento">
                
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" 
                    pattern="[0-9]{3}.[0-9]{3}.[0-9]{3}-[0-9]{2}">
            </fieldset>
            
            <fieldset>
                <legend>Endereço</legend>
                
                <label for="cep">CEP:</label>
                <input type="text" id="cep" name="cep"
                    pattern="[0-9]{5}-[0-9]{3}">
                
                <label for="endereco">Endereço:</label>
                <input type="text" id="endereco" name="endereco">

                <label for="numero">Número:</label>
                <input type="number" id="numero" name="numero">

                <label>Complemento:</label>
                <input type="text" id="complemento" name="complemento">

                <label>Bairro:</label>
                <input type="text" id="bairro" name="bairro">

                <label>Cidade:</label>
                <input type="text" id="cidade" name="cidade">

                <label>Estado:</label>
                <select id="estado" name="estado">
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                    <option value="DF">Distrito Federal</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Informações adicionais:</legend>

                <label>Área de interesse:</label>
                <select>
                    <option value="voluntario">Trabalho voluntário</option>
                    <option value="doacao">Doação</option>
                    <option value="parceria">Parceria</option>
                </select>

                <label for="habilidades">Habilidades</label>
                <input type="text" id="habilidades" name="habilidades">

                <label for="origem">Como você conheceu o instituto?</label>
                <input type="text" id="origem" name="origem">
            </fieldset>

            <fieldset>
                <legend>Mensagem:</legend>

                <label for="mensagem">Conte-nos um pouco sobre você:</label>
                <input type="text" id="mensagem" name="mensagem">
            </fieldset>

            <button type="submit">Enviar</button>
        </form>
    </main>
    <footer class="copyright">
        © 2026 Instituto Novo Caminho. Todos os direitos reservados.
    </footer>
</body>
</html>
